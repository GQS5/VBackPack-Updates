site_name: VBackpack Documentation
site_description: Official documentation for VBackpack by VackStudio.
site_url: https://gqs5.github.io/VBackPack-Updates/
repo_url: https://github.com/GQS5/VBackPack-Updates
repo_name: GQS5/VBackPack-Updates

theme:
  name: material
  language: en
  generator: false
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: system-ui
    code: Roboto Mono

copyright: VBackpack by VackStudio · Public documentation

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Getting Started: getting-started.md
  - Gameplay:
      - Backpacks: backpacks.md
      - Artifacts: artifacts.md
      - Fusion: fusion.md
      - Achievements: achievements.md
  - Administration:
      - Commands: commands.md
      - Permissions: permissions.md
      - Admin Inspector: admin-inspector.md
  - Reference:
      - Configuration: configuration.md
      - Storage: storage.md
      - Compatibility: compatibility.md
  - Help:
      - Troubleshooting: troubleshooting.md
      - FAQ: faq.md
